version: '3.8'
services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
  user-service:
    build: ./user-service
    ports:
      - "3001:3001"
    env_file:
      - ./.env
    environment:
      - PORT=3001
  doctor-service:
    build: ./doctor-service
    ports:
      - "3002:3002"
    env_file:
      - ./.env
    environment:
      - PORT=3002
  appointment-service:
    build: ./appointment-service
    ports:
      - "3003:3003"
    env_file:
      - ./.env
    environment:
      - PORT=3003
  telemedicine-service:
    build: ./telemedicine-service
    ports:
      - "3004:3004"
    env_file:
      - ./.env
    environment:
      - PORT=3004
  payment-service:
    build: ./payment-service
    ports:
      - "3005:3005"
    env_file:
      - ./.env
    environment:
      - PORT=3005
  mongo:
    image: mongo:5.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=healthcare
volumes:
  mongo_data: