apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
  namespace: healthcare
  labels:
    app: appointment-service
    app.kubernetes.io/part-of: smart-healthcare
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appointment-service
  template:
    metadata:
      labels:
        app: appointment-service
        app.kubernetes.io/part-of: smart-healthcare
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: appointment-service
          image: smart-healthcare/appointment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
                name: healthcare-config
            - secretRef:
                name: healthcare-secret
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: APPOINTMENT_SERVICE_PORT
          livenessProbe:
            tcpSocket:
              port: 3003
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: appointment-service
  namespace: healthcare
  labels:
    app: appointment-service
    app.kubernetes.io/part-of: smart-healthcare
spec:
  type: ClusterIP
  selector:
    app: appointment-service
  ports:
    - name: http
      port: 3003
      targetPort: 3003
