apiVersion: v1
kind: Secret
metadata:
  name: healthcare-secret
  namespace: healthcare
  labels:
    app.kubernetes.io/part-of: smart-healthcare
    app.kubernetes.io/component: config

type: Opaque
stringData:
  # MongoDB
  MONGO_INITDB_ROOT_USERNAME: "admin"
  MONGO_INITDB_ROOT_PASSWORD: "admin123"
  MONGO_DB_NAME: "healthcare"
  MONGO_URI: "mongodb://admin:admin123@mongodb:27017/healthcare?authSource=admin"

  # Auth
  JWT_SECRET: "replace-with-strong-jwt-secret"
  INTERNAL_SERVICE_TOKEN: "medikaline-internal-token"

  # AI / payment providers
  OPENAI_API_KEY: ""
  STRIPE_SECRET_KEY: ""

  # PayHere placeholders
  PAYHERE_MERCHANT_ID: ""
  PAYHERE_MERCHANT_SECRET: ""

  # Nodemailer placeholders
  NODEMAILER_USER: "your-email@example.com"
  NODEMAILER_PASS: "your-email-app-password"
