apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: healthcare
  labels:
    app: frontend
    app.kubernetes.io/part-of: smart-healthcare
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/part-of: smart-healthcare
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: smart-healthcare/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 8
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: healthcare
  labels:
    app: frontend
    app.kubernetes.io/part-of: smart-healthcare
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
