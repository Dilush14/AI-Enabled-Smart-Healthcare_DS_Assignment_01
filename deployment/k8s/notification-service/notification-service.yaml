apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: healthcare
  labels:
    app: notification-service
    app.kubernetes.io/part-of: smart-healthcare
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        app.kubernetes.io/part-of: smart-healthcare
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: notification-service
          image: smart-healthcare/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3006
          envFrom:
            - configMapRef:
                name: healthcare-config
            - secretRef:
                name: healthcare-secret
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: NOTIFICATION_SERVICE_PORT
          livenessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 8
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: healthcare
  labels:
    app: notification-service
    app.kubernetes.io/part-of: smart-healthcare
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      port: 3006
      targetPort: 3006
